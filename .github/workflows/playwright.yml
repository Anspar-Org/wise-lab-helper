name: Playwright E2E Tests (Full Stack)

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, firefox-desktop, webkit-desktop]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start full stack with Docker Compose
        run: docker compose -f docker-compose.test.yml up -d
        env:
          COMPOSE_HTTP_TIMEOUT: 200

      - name: Wait for database to be healthy
        run: |
          timeout 60 bash -c 'until docker compose -f docker-compose.test.yml exec -T db-test pg_isready -U postgres; do sleep 2; done'

      - name: Wait for API to be healthy
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

      - name: Wait for web server to be ready
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'

      - name: Seed test database
        run: npm run seed:e2e --workspace=packages/database
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5433/stemlab_test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.project == 'chromium-desktop' && 'chromium' || matrix.project == 'firefox-desktop' && 'firefox' || 'webkit' }}
        working-directory: apps/web

      - name: Run Playwright tests
        run: npm run test:e2e -- --project=${{ matrix.project }}
        working-directory: apps/web
        env:
          CI: true
          PLAYWRIGHT_SKIP_SERVER: true
          BASE_URL: http://localhost:5173

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.project }}
          path: apps/web/test-results/
          retention-days: 30

      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  test-mobile:
    name: Run Mobile Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start full stack with Docker Compose
        run: docker compose -f docker-compose.test.yml up -d
        env:
          COMPOSE_HTTP_TIMEOUT: 200

      - name: Wait for database to be healthy
        run: |
          timeout 60 bash -c 'until docker compose -f docker-compose.test.yml exec -T db-test pg_isready -U postgres; do sleep 2; done'

      - name: Wait for API to be healthy
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

      - name: Wait for web server to be ready
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'

      - name: Seed test database
        run: npm run seed:e2e --workspace=packages/database
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5433/stemlab_test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Mobile Playwright tests
        run: npm run test:e2e -- --project=mobile-touch --project=mobile-portrait
        working-directory: apps/web
        env:
          CI: true
          PLAYWRIGHT_SKIP_SERVER: true
          BASE_URL: http://localhost:5173

      - name: Upload Mobile Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mobile
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  accessibility:
    name: Accessibility Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start full stack with Docker Compose
        run: docker compose -f docker-compose.test.yml up -d
        env:
          COMPOSE_HTTP_TIMEOUT: 200

      - name: Wait for database to be healthy
        run: |
          timeout 60 bash -c 'until docker compose -f docker-compose.test.yml exec -T db-test pg_isready -U postgres; do sleep 2; done'

      - name: Wait for API to be healthy
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

      - name: Wait for web server to be ready
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'

      - name: Seed test database
        run: npm run seed:e2e --workspace=packages/database
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5433/stemlab_test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Accessibility tests
        run: npm run test:e2e -- tests/e2e/specs/accessibility.spec.ts
        working-directory: apps/web
        env:
          CI: true
          PLAYWRIGHT_SKIP_SERVER: true
          BASE_URL: http://localhost:5173

      - name: Upload Accessibility Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-accessibility
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  results:
    name: Combine Test Results
    needs: [test, test-mobile, accessibility]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: List artifacts
        run: ls -R all-reports

      - name: Generate combined report
        run: |
          echo "# Playwright E2E Test Results (Full Stack)" > test-summary.md
          echo "" >> test-summary.md
          echo "All E2E tests run against real backend (PostgreSQL + Express API)." >> test-summary.md
          echo "" >> test-summary.md
          echo "View individual reports in the artifacts section." >> test-summary.md

      - name: Upload combined summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md
          retention-days: 30

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
