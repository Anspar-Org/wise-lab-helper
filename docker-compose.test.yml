version: '3.8'

services:
  # PostgreSQL test database
  db-test:
    image: postgres:16-alpine
    container_name: stemlab-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: stemlab_test
    ports:
      - '5433:5432'  # Use 5433 to avoid conflict with dev database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - test-db-data:/var/lib/postgresql/data
    networks:
      - test-network

  # API test server
  api-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: stemlab-test-api
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:testpassword@db-test:5432/stemlab_test
      DATABASE_LOCAL_ONLY: 'false'
      JWT_SECRET: test-jwt-secret-for-e2e-testing-only
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - test-network
    command: npm run dev --workspace=apps/api

  # Web test server (Vite)
  web-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: stemlab-test-web
    depends_on:
      api-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      VITE_API_URL: http://localhost:3001
    ports:
      - '5173:5173'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5173']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - test-network
    command: npm run dev --workspace=apps/web

volumes:
  test-db-data:
    driver: local

networks:
  test-network:
    driver: bridge
