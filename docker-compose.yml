services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: stemlab-db
    environment:
      POSTGRES_USER: stemlab
      POSTGRES_PASSWORD: stemlab_dev_password
      POSTGRES_DB: stemlab_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stemlab"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: stemlab-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://stemlab:stemlab_dev_password@db:5432/stemlab_dev
      JWT_SECRET: dev_jwt_secret_change_in_production
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev --workspace=apps/api

  # Frontend Web App
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: stemlab-web
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api
    command: npm run dev --workspace=apps/web

volumes:
  postgres_data:
  uploads:
